[project]
name = "omora-plugin-media"
version = "0.1.0"
description = "音频 / 视频文件的存取"
requires-python = ">=3.14"
dependencies = [
    "omora-sdk",
]

[project.entry-points."omora.plugins"]
media = "omora.media:MediaPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
omora-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["omora"]

[tool.omora]
platforms = []
capabilities = []
listed = true
requires = []
