[project]
name = "omora-plugin-store"
version = "0.1.0"
description = "条目的持久化与查询"
requires-python = ">=3.14"
dependencies = [
    "omora-sdk",
]

[project.entry-points."omora.plugins"]
store = "omora.store:StorePlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
omora-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["omora"]

[tool.omora]
platforms = []
capabilities = []
listed = true
requires = []
