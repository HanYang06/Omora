[project]
name = "omora-plugin-ui"
version = "0.1.0"
description = "页面登记、渲染、事件派发"
requires-python = ">=3.14"
dependencies = [
    "omora-sdk",
]

[project.entry-points."omora.plugins"]
ui = "omora.ui:UiPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
omora-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["omora"]

[tool.omora]
platforms = []
capabilities = []
listed = true
requires = []
