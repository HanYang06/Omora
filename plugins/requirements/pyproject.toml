[project]
name = "omora-plugin-requirements"
version = "0.1.0"
description = "Omora official requirements plugin"
requires-python = ">=3.12"
dependencies = ["omora-sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omora_plugins_requirements"]

[tool.uv.sources]
omora-sdk = { workspace = true }

[tool.uv]
package = true
