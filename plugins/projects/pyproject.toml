[project]
name = "omora-plugin-projects"
version = "0.1.0"
description = "Omora official projects plugin"
requires-python = ">=3.12"
dependencies = ["omora-sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omora_plugins_projects"]

[tool.uv.sources]
omora-sdk = { workspace = true }

[tool.uv]
package = true
