name: commit-msg

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: commit-msg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 1
          persist-credentials: false
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TITLE" > /tmp/pr-title
          python3 scripts/commit_msg.py /tmp/pr-title
      - name: Check last commit message
        run: |
          set -euo pipefail
          git log -1 --format=%B > /tmp/commit-msg
          git log -1 --oneline
          python3 scripts/commit_msg.py /tmp/commit-msg
