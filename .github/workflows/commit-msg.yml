name: commit-msg

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 校验 PR 内每条提交
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > /tmp/commit-msg
            if ! python3 scripts/commit_msg.py /tmp/commit-msg; then
              echo "提交 $sha 不符合规范"
              failed=1
            fi
          done
          exit "$failed"
