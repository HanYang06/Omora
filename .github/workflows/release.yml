name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.22"
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: "12.18.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/ui-engine/pnpm-lock.yaml
      - name: 安装 Python 依赖
        run: uv sync --frozen --all-groups
      - name: 安装前端依赖
        run: pnpm --dir app/ui-engine install --frozen-lockfile
      - name: 标签必须等于 VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: 跑门禁
        run: uv run python scripts/check.py
      - name: 发布构建
        run: uv run python scripts/build.py
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --title "$GITHUB_REF_NAME" --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
