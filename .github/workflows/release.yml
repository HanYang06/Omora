name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: "12.18.0"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: 标签必须等于 VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: pytest
        run: uv run pytest
      - name: vitest
        run: pnpm --dir app/ui-engine exec vitest run --configLoader runner
      - name: 发布构建
        run: uv run python scripts/build.py
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --title "$GITHUB_REF_NAME" --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
