version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      python-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      javascript-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
