[project]
name = "omora-plugin-video"
version = "0.1.0"
description = "视频捕捉：分辨率档、时限、大小上限与后期处理钩子"
requires-python = ">=3.14"
dependencies = [
    "imageio-ffmpeg>=0.8.1",
    "omora-sdk",
]

[project.entry-points."omora.plugins"]
video = "omora.video:VideoPlugin"

[tool.omora]
# manager 读这四个键；设备门禁在客户端，不在这里。
capabilities = ["camera"]
platforms = ["win32", "darwin", "linux"]
listed = true
requires = ["media"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
omora-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["omora"]
