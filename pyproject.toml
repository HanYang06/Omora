[project]
name = "omora"
version = "0.1.0"
description = "本地优先的灵感与项目管理工具"
readme = "README.md"
authors = [
    { name = "HanYang06", email = "206431259+HanYang06@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "omora-plugin-store",
    "omora-plugin-manager",
    "omora-plugin-media",
    "omora-plugin-ui",
    "omora-plugin-ideas",
    "omora-plugin-projects",
    "omora-plugin-requirements",
    "omora-plugin-net",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
package = false

[tool.uv.sources]
omora-plugin-store = { workspace = true }
omora-plugin-manager = { workspace = true }
omora-plugin-media = { workspace = true }
omora-plugin-ui = { workspace = true }
omora-plugin-ideas = { workspace = true }
omora-plugin-projects = { workspace = true }
omora-plugin-requirements = { workspace = true }
omora-plugin-net = { workspace = true }

[tool.uv.workspace]
members = ["app/core", "app/sdk", "app/packages/*"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".agents", ".venv"]

[tool.ruff.lint.isort]
known-first-party = ["boot", "main", "omora"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "app"
explicit_package_bases = true
