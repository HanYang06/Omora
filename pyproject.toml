[project]
name = "omora-workspace"
version = "0.1.0"
description = "Omora monorepo workspace"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "pyright>=1.1.390",
    "import-linter>=2.1",
    "jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sdk", "kernel", "plugins/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".agents", ".venv", "node_modules", "dist", ".build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]
"**/tests/**" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["kernel/tests", "plugins"]
addopts = "-q"

[tool.pyright]
include = [
    "sdk/src",
    "kernel/src",
    "kernel/tests",
    "plugins/*/src",
    "plugins/*/tests",
    "scripts",
]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
extraPaths = ["scripts"]

[tool.importlinter]
root_packages = [
    "omora_kernel",
    "omora_sdk",
    "omora_plugins_ideas",
    "omora_plugins_projects",
    "omora_plugins_requirements",
]

[[tool.importlinter.contracts]]
name = "SDK 不得依赖内核或插件"
type = "forbidden"
source_modules = ["omora_sdk"]
forbidden_modules = [
    "omora_kernel",
    "omora_plugins_ideas",
    "omora_plugins_projects",
    "omora_plugins_requirements",
]

[[tool.importlinter.contracts]]
name = "内核不得依赖插件"
type = "forbidden"
source_modules = ["omora_kernel"]
forbidden_modules = ["omora_plugins_ideas", "omora_plugins_projects", "omora_plugins_requirements"]

[[tool.importlinter.contracts]]
name = "插件不得依赖内核"
type = "forbidden"
source_modules = ["omora_plugins_ideas"]
forbidden_modules = ["omora_kernel", "omora_plugins_projects", "omora_plugins_requirements"]
