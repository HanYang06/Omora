; 系统配置：随发行包出去，用户不该改。
; 段名 = 插件名；enabled 决定开不开，其余键交给插件自己。

[store]
enabled = true
path = .omora/omora.db

[media]
enabled = true
root = .omora/media

[ui]
enabled = true

[ideas]
enabled = true

[projects]
enabled = true

[requirements]
enabled = true

[net]
enabled = true
host = 127.0.0.1
port = 8765
