; 系统配置：随发行包出去，用户不该改。
; 段名 = 插件名；enabled 决定开不开，其余键交给插件自己。

[store]
enabled = true
path = .omora/omora.db

[manager]
enabled = true

[media]
enabled = true
root = .omora/media
max_mb = 64

[ui]
enabled = true

[audio]
enabled = true
quality = high
noise_reduction = true
; 0 = 不限时长；音频走 HTTP 媒体通道，帧里只过 media id。
max_seconds = 0

[video]
enabled = true
quality = 720p
max_seconds = 1800
max_mb = 64

[ideas]
enabled = true

[projects]
enabled = true

[requirements]
enabled = true

[net]
enabled = true
host = 127.0.0.1
port = 8765
media_port = 0
media_origins = http://127.0.0.1:5173,http://localhost:5173